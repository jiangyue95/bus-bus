name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow only needs to read the code.
permissions:
  contents: read

# A new push to the same branch cancels the run that is still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    services:
      # The importer tests run real SQL, so they need a real PostgreSQL. Same major version as local development.
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: busbus_test
          # No password, like the local Homebrew setup. The container lives only for this job
          # and is reachable only from the runner.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # The job waits until the database accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Locally the role is the OS user; in the container it is "postgres".
      DB_USER: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: ./mvnw --batch-mode test
