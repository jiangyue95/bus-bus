# Test overrides. Spring Boot reads classpath:/config/application.properties after
# classpath:/application.properties, so these values win and the main file is still loaded.

# Tests use their own database, so they never touch the development data in "busbus".
spring.datasource.url=jdbc:postgresql://localhost:5432/busbus_test

# Tests never download the real GTFS Static file; they import small zips they build themselves.
gtfs.import-mode=never

# An empty key disables polling, so tests never call the real NTA API, even if .env has a key.
nta.api-key=
