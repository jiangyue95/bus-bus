spring.application.name=backend

# Local secrets live in bus-bus/.env (git-ignored). Optional, so the app also starts without it.
spring.config.import=optional:file:../.env[.properties]

# Local PostgreSQL. The defaults match a Homebrew install: a role named after the OS user and no
# password. Override with DB_URL, DB_USER and DB_PASSWORD (for example in .env) anywhere else.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/busbus}
spring.datasource.username=${DB_USER:${user.name}}
spring.datasource.password=${DB_PASSWORD:}

# GTFS Static (timetable data). No API key is needed for this download.
gtfs.static-url=https://www.transportforireland.ie/transitData/Data/GTFS_Realtime.zip
# if-empty: import at startup only when the tables are empty. always: re-import at every startup.
# never: do not import.
gtfs.import-mode=if-empty

nta.base-url=https://api.nationaltransport.ie/gtfsr/v2
nta.api-key=${NTA_API_KEY:}
# Conservative default until the NTA rate limit is confirmed.
nta.poll-interval=60s
